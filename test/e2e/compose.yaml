# End-to-end test stack: gateway and 8 real servers. Six register themselves
# with the vecta server jar (five as a Java agent — one of them hidden — and one
# in wrapper mode behind the guard), two are static in the gateway config, and
# an echo container backs the side port scenario.
# Normally driven by test/e2e/run.sh, which copies this directory to the Docker
# host and runs, there:
#   docker compose up -d --build
#   sh tune-paper.sh
# Tear down on the Docker host with: docker compose down -v
name: vecta-test

x-mc: &mc
  image: itzg/minecraft-server:latest
  restart: unless-stopped
  labels: [vecta-test=true]
  environment: &mcenv
    EULA: "TRUE"
    ONLINE_MODE: "FALSE"
    ENFORCE_SECURE_PROFILE: "FALSE"
    MEMORY: 1G
    VIEW_DISTANCE: "4"
    SPAWN_PROTECTION: "0"
    LEVEL_TYPE: minecraft:flat
    VECTA_GATEWAY: http://gateway:8080

x-vecta: &vecta
  build: .
  image: vecta-test/vecta:e2e
  labels: [vecta-test=true]
  restart: on-failure

services:
  gateway:
    <<: *vecta
    command: ["gateway", "-config", "/etc/vecta/gateway.json", "-v"]
    ports:
      - "35565:25565"
      - "38080:8080"
      - "34500-34509:34500-34509/tcp"
      - "34500-34509:34500-34509/udp"
    networks:
      default:
        # Real clients inside the network join by name, like players would.
        aliases:
          - play.test
          - lobby.play.test
          - paper-a.play.test
          - paper-via.play.test
          - paper-legacy.play.test
          - vanilla-old.play.test
          - fabric-pack.play.test
          - neo-pack.play.test
          - forge-pack.play.test
          - paper-plugin.play.test

  # Echo backend for side ports: static server "echo" in gateway.json exposes
  # UDP 7000 and TCP 7001 through the gateway's side port pool.
  echo:
    image: alpine/socat:latest
    labels: [vecta-test=true]
    restart: unless-stopped
    entrypoint: ["sh", "-c", "socat UDP-LISTEN:7000,fork EXEC:cat & exec socat TCP-LISTEN:7001,fork,reuseaddr EXEC:cat"]

  # L: Paper 1.8.8 on Java 8. vecta.jar in wrapper mode starts the Paper jar
  # (detected in /data) and guards it: the guard takes port 25565, Paper moves
  # to 25566, and only connections signed by the gateway get through.
  mc-paper-legacy:
    <<: *mc
    image: itzg/minecraft-server:java8
    environment:
      <<: *mcenv
      TYPE: PAPER
      VERSION: "1.8.8"
      MOTD: Paper legacy
      SERVER_PORT: "25566"
      CUSTOM_JAR_EXEC: "-jar /vecta/vecta.jar"
      VECTA_TOKEN: tok-l
      VECTA_SERVER_ID: paper-legacy
      VECTA_NAME: Paper 1.8.8
      VECTA_ADDRESS: mc-paper-legacy:25565
      VECTA_GUARD: "true"
      VECTA_GUARD_LISTEN: 0.0.0.0:25565
      VECTA_GUARD_JOIN_HINT: play.test
    volumes:
      - ./vecta-jar:/vecta:ro

  # A: Paper 1.21.11, static in gateway config
  mc-paper-a:
    <<: *mc
    environment:
      <<: *mcenv
      TYPE: PAPER
      VERSION: "1.21.11"
      MOTD: Paper A

  # B: Paper 1.21.4 + ViaVersion/ViaBackwards/ViaRewind. The jar (agent mode)
  # reads the protocol list from ViaVersion at runtime.
  mc-paper-via:
    <<: *mc
    environment:
      <<: *mcenv
      TYPE: PAPER
      VERSION: "1.21.4"
      MODRINTH_PROJECTS: "viaversion,viabackwards,viarewind"
      MOTD: Paper Via
      JVM_OPTS: -javaagent:/vecta/vecta.jar
      VECTA_TOKEN: tok-b
      VECTA_SERVER_ID: paper-via
      VECTA_NAME: Paper 1.21.4 + Via
      VECTA_ADDRESS: mc-paper-via:25565
    volumes:
      - ./vecta-jar:/vecta:ro

  # C: Vanilla 1.20.1, static in gateway config
  mc-vanilla-old:
    <<: *mc
    environment:
      <<: *mcenv
      TYPE: VANILLA
      VERSION: "1.20.1"
      MOTD: Vanilla old

  # D: Fabric 1.21.1 modpack, jar (agent mode) reports loaded mods and channels
  mc-fabric:
    <<: *mc
    environment:
      <<: *mcenv
      TYPE: FABRIC
      VERSION: "1.21.1"
      MEMORY: 1500M
      MODRINTH_PROJECTS: "fabric-api,appleskin,lithium"
      MOTD: Fabric pack
      JVM_OPTS: -javaagent:/vecta/vecta.jar
      VECTA_TOKEN: tok-d
      VECTA_SERVER_ID: fabric-pack
      VECTA_NAME: Fabric 1.21.1 pack
      VECTA_ADDRESS: mc-fabric:25565
      VECTA_REQUIRED_CLIENT_MODS: appleskin
      # A side port with the print hook (writes /data/sideports.txt).
      VECTA_SIDE_PORTS: voice:udp:24454
      VECTA_SIDE_PORT_HOOK: sh /hooks/print.sh
    volumes:
      - fabric-data:/data
      - ./vecta-jar:/vecta:ro
      - ./hooks:/hooks:ro

  # E: NeoForge 1.21.1 modpack, jar (agent mode via user_jvm_args.txt)
  mc-neoforge:
    <<: *mc
    environment:
      <<: *mcenv
      TYPE: NEOFORGE
      VERSION: "1.21.1"
      MEMORY: 2G
      MODRINTH_PROJECTS: "jei"
      MOTD: NeoForge pack
      JVM_OPTS: -javaagent:/vecta/vecta.jar
      VECTA_TOKEN: tok-e
      VECTA_SERVER_ID: neo-pack
      VECTA_NAME: NeoForge 1.21.1 pack
      VECTA_ADDRESS: mc-neoforge:25565
    volumes:
      - neoforge-data:/data
      - ./vecta-jar:/vecta:ro

  # P: Paper 1.21.4 + Via, registered by the jar as a hidden server (reachable as
  # paper-plugin.play.test and a transfer target only). Exercises the jar's
  # in-game /hub and /server commands end to end.
  mc-paper-plugin:
    <<: *mc
    environment:
      <<: *mcenv
      TYPE: PAPER
      VERSION: "1.21.4"
      MODRINTH_PROJECTS: "viaversion,viabackwards"
      MOTD: Paper hidden
      JVM_OPTS: -javaagent:/vecta/vecta.jar
      VECTA_TOKEN: tok-plugin
      VECTA_SERVER_ID: paper-plugin
      VECTA_NAME: Paper hidden
      VECTA_ADDRESS: mc-paper-plugin:25565
      VECTA_HIDDEN: "true"
    volumes:
      - ./vecta-jar:/vecta:ro

  # F: Forge 1.20.1 pack with a both-sides mod, jar (agent mode)
  mc-forge:
    <<: *mc
    environment:
      <<: *mcenv
      TYPE: FORGE
      VERSION: "1.20.1"
      MEMORY: 2G
      MODRINTH_PROJECTS: "waystones,balm"
      MOTD: Forge pack
      JVM_OPTS: -javaagent:/vecta/vecta.jar
      VECTA_TOKEN: tok-f
      VECTA_SERVER_ID: forge-pack
      VECTA_NAME: Forge 1.20.1 pack
      VECTA_ADDRESS: mc-forge:25565
    volumes:
      - forge-data:/data
      - ./vecta-jar:/vecta:ro

volumes:
  fabric-data:
  neoforge-data:
  forge-data:
