# vecta gateway with Docker Compose.
#
#   cp .env.example .env        # fill in domain, secrets, tokens
#   docker compose up -d --build
#   docker compose logs -f
#
# gateway.json is read with ${VAR} expansion from the container environment
# (.env). State (remembered routes, sticky servers) lives in the vecta-data
# volume.
name: vecta

services:
  vecta:
    image: ${VECTA_IMAGE:-vecta:latest}
    build:
      context: ..
      args:
        VERSION: ${VECTA_VERSION:-dev}
    restart: unless-stopped
    command: ["gateway", "-config", "/etc/vecta/gateway.json"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./gateway.json:/etc/vecta/gateway.json:ro
      - vecta-data:/data
    ports:
      - "${MC_PORT:-25565}:25565"   # Minecraft (NPM stream target)
      - "${API_PORT:-8080}:8080"    # owner API, status page, /metrics (NPM proxy host target)
      # Side ports (voice chat, maps, ...), published directly: NPM streams
      # cannot forward a port range. Must match VECTA_SIDEPORT_RANGE.
      - "${VECTA_SIDEPORT_RANGE:-24500-24599}:${VECTA_SIDEPORT_RANGE:-24500-24599}/tcp"
      - "${VECTA_SIDEPORT_RANGE:-24500-24599}:${VECTA_SIDEPORT_RANGE:-24500-24599}/udp"
    # Nginx Proxy Manager in Docker on the same host: remove "ports" above,
    # uncomment the networks below, and point NPM's stream at vecta:25565
    # and its proxy host at vecta:8080.
    # networks: [default, npm]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vecta-data:

# networks:
#   npm:
#     external: true
#     name: npm_default   # `docker network ls` shows your NPM network's name
