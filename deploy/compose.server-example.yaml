# Example backend: a Fabric server that registers itself with the gateway
# through the vecta server jar (plugins/universal) in Java agent mode, with
# the guard on so only the gateway can connect. Run it on any host the gateway
# can reach. Put vecta.jar next to this file.
#
#   export VECTA_TOKEN=... VECTA_ADDRESS=10.0.0.31:25565
#   docker compose -f compose.server-example.yaml up -d
name: survival

services:
  minecraft:
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "1.21.1"
      ONLINE_MODE: "TRUE"   # the backend authenticates players; the gateway only routes
      MODRINTH_PROJECTS: "fabric-api,appleskin"
      MEMORY: 2G
      # The guard takes the public port; the server moves to 25566.
      SERVER_PORT: "25566"
      JVM_OPTS: -javaagent:/vecta/vecta.jar
      VECTA_GATEWAY: ${VECTA_GATEWAY:-https://mc-api.example.com}
      VECTA_TOKEN: ${VECTA_TOKEN:?set VECTA_TOKEN to your owner token}
      VECTA_SERVER_ID: ${VECTA_SERVER_ID:-survival}
      VECTA_NAME: ${VECTA_NAME:-Survival}
      VECTA_ADDRESS: ${VECTA_ADDRESS:?set VECTA_ADDRESS to host:port the gateway dials}
      VECTA_GUARD: "true"
      VECTA_GUARD_LISTEN: 0.0.0.0:25565
      VECTA_GUARD_JOIN_HINT: ${VECTA_JOIN_HINT:-play.example.com}
    ports:
      - "25565:25565"   # only the guard is published
    volumes:
      - minecraft-data:/data
      - ./vecta.jar:/vecta/vecta.jar:ro

volumes:
  minecraft-data:
